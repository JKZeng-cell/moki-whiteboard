name: macOS Packages

on:
  workflow_dispatch:
    inputs:
      architecture:
        description: Native Mac architecture to package
        type: choice
        default: all
        options: [all, arm64, x64]

permissions:
  contents: read

jobs:
  package:
    name: macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(inputs.architecture == 'arm64' && '["arm64"]' || inputs.architecture == 'x64' && '["x64"]' || '["arm64","x64"]') }}
    runs-on: ${{ matrix.arch == 'arm64' && 'macos-15' || 'macos-15-intel' }}
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      UNIVER_DSH_GATEWAY_DEBUG: '1'
    steps:
      - uses: actions/checkout@v5
      - name: Use a physical temporary directory for isolated cache tests
        run: |
          temp_root="$(mktemp -d /private/tmp/moki-whiteboard-ci.XXXXXX)"
          echo "TMPDIR=$temp_root/" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          architecture: ${{ matrix.arch }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: node examples/agent-quickstart.mjs
      - run: npm run desktop:dist:mac -- --arch=${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: MOKI-Whiteboard-macOS-${{ matrix.arch }}
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
          path: |
            release-build-mac-*/*.dmg
            release-build-mac-*/*.zip
            release-build-mac-*/*.txt
            release-build-mac-*/*verification.json
